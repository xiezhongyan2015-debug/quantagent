[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-agents"
version = "0.1.0"
description = "LangGraph supervisor-based multi-agent quant strategy generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0.0",
  "importlib-metadata>=8.0.0",
  "langgraph>=0.2.0",
  "jinja2>=3.1.0",
  "openai>=1.35.0",
  "pandas>=2.0.0",
  "python-dotenv>=1.0.1",
  "matplotlib>=3.8.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
vnpy = [
  "dolphindb",
  "vnpy>=4.0.0",
  "vnpy-dolphindb==1.0.0",
  "vnpy-sqlite>=1.1.3",
  "vnpy_portfoliostrategy>=1.3.0",
  "vnpy_ctastrategy>=1.2.0",
]
web = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
research = ["statsmodels>=0.14.0"]
dev = [
  "pylint>=3.0.0",
  "pytest>=8.0.0",
  "pyarrow>=15.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quanta_agents = ["prompts/agents/*.yaml", "prompts/semantic/*.yaml", "meta/web/*.html"]
