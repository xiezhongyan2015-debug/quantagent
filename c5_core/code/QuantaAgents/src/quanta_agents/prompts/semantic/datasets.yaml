datasets:
  - table_key: "stock_kline_daily_qfq" #唯一标识符
    description: "股票日K线数据集（前复权）"
    type: "time_series"
    granularity: "1d"
    symbol_column: "code"
    datetime_column: "trade_date"
    time_range:
      start_time: "2015-01-05 00:00:00"
      end_time: "2026-01-01 00:00:00"
    fields:
      - name: "open"
        meaning: "开盘价"
      - name: "high"
        meaning: "最高价"
      - name: "low"
        meaning: "最低价"
      - name: "close"
        meaning: "收盘价"
      - name: "volume"
        meaning: "成交量"
      - name: "amount"
        meaning: "成交额"
      - name: "float_shares"
        meaning: "流通股本"
      - name: "total_shares"
        meaning: "总股本"
      - name: "raw_prev_close"
        meaning: "未复权的交易所前收盘价"
      - name: "is_st"
        meaning: "当日是否为ST或*ST等风险警示股票"
      - name: "is_delisting"
        meaning: "当日是否处于退市整理期"
      - name: "float_market_cap"
        meaning: "当日流通市值"
      - name: "total_market_cap"
        meaning: "当日总市值"
      - name: "gu_1m"
        meaning: "分钟上涨收益的时间重心"
      - name: "gd_1m"
        meaning: "分钟下跌收益的时间重心"
      - name: "rbar_up17"
        meaning: "上涨分钟收益的日内控制变量"
      - name: "rbar_down17"
        meaning: "下跌分钟收益的日内控制变量"
      - name: "r_0931_1000"
        meaning: "09:31至10:00收益"
      - name: "r_1001_1030"
        meaning: "10:01至10:30收益"
      - name: "overnight_return"
        meaning: "隔夜收益"
  - table_key: "csi300_membership"
    description: "沪深300历史成分区间；每一行表示某只股票在开始日到结束日之间属于指数，日期两端均包含"
    type: "static"
    symbol_column: "code"
    fields:
      - name: "code"
        meaning: "股票代码，格式为000001.SZ或600000.SH"
      - name: "start_date"
        meaning: "本段成分资格开始日，包含当日"
      - name: "end_date"
        meaning: "本段成分资格结束日，包含当日"
  - table_key: "csi500_membership"
    description: "中证500历史成分区间；日期两端均包含"
    type: "static"
    symbol_column: "code"
    fields:
      - name: "code"
        meaning: "股票代码"
      - name: "start_date"
        meaning: "本段成分资格开始日，包含当日"
      - name: "end_date"
        meaning: "本段成分资格结束日，包含当日"
  - table_key: "csi800_membership"
    description: "中证800历史成分区间；日期两端均包含"
    type: "static"
    symbol_column: "code"
    fields:
      - name: "code"
        meaning: "股票代码"
      - name: "start_date"
        meaning: "本段成分资格开始日，包含当日"
      - name: "end_date"
        meaning: "本段成分资格结束日，包含当日"
  - table_key: "csi1000_membership"
    description: "中证1000历史成分区间；日期两端均包含"
    type: "static"
    symbol_column: "code"
    fields:
      - name: "code"
        meaning: "股票代码"
      - name: "start_date"
        meaning: "本段成分资格开始日，包含当日"
      - name: "end_date"
        meaning: "本段成分资格结束日，包含当日"
  - table_key: "csiall_membership"
    description: "中证全指历史成分区间；日期两端均包含"
    type: "static"
    symbol_column: "code"
    fields:
      - name: "code"
        meaning: "股票代码"
      - name: "start_date"
        meaning: "本段成分资格开始日，包含当日"
      - name: "end_date"
        meaning: "本段成分资格结束日，包含当日"
  - table_key: "periodic_minute_events"
    description: "多年1分钟量能规律候选；每行是一段已经出现五批规律放量、并在预计下一批前两分钟完成确认的事件"
    type: "auxiliary"
    granularity: "event_1m"
    datetime_column: "date"
    symbol_column: "code"
    primary_keys: ["candidate_id"]
    time_range:
      start_time: "2022-01-01 00:00:00"
      end_time: "2025-12-31 23:59:59"
    fields:
      - name: "candidate_id"
        meaning: "事件编号"
      - name: "date"
        meaning: "交易日"
      - name: "code"
        meaning: "股票代码，格式如sh600000或sz000001"
      - name: "trigger_ts"
        meaning: "全部筛选条件已可见的时刻；信号最早从下一分钟开盘执行"
      - name: "trigger_low_to_prev5_close_ma5_distance"
        meaning: "截至trigger分钟的当日最低价相对前5个已完成交易日收盘价均值的距离；只使用决策时已知数据"
      - name: "trigger_low_to_live_close_ma5_distance"
        meaning: "截至trigger分钟的当日最低价相对盘中五日均线的距离；盘中五日均线只使用前4个已完成交易日收盘价和trigger分钟收盘价"
      - name: "predicted_ts"
        meaning: "按前五批间隔预计的下一批时刻"
      - name: "period"
        meaning: "五批量能节奏的分钟间隔"
      - name: "gap_min"
        meaning: "前五批四个间隔中的最小值"
      - name: "gap_max"
        meaning: "前五批四个间隔中的最大值"
      - name: "past_up_count"
        meaning: "前五批中上涨分钟的数量"
      - name: "return_stability"
        meaning: "前五批涨跌幅的离散程度，越小越接近"
      - name: "amount_cv"
        meaning: "前五批成交额的离散程度，越小越接近"
      - name: "volume_z_mean"
        meaning: "前五批相对过去20日同一分钟的平均异常程度"
      - name: "volume_z_cv"
        meaning: "前五批异常程度的离散程度"
      - name: "no_early_spike"
        meaning: "第五批之后到确认时刻前是否没有提前放量"
      - name: "pre_window_up"
        meaning: "确认分钟是否上涨"
      - name: "pulse_close_position_mean"
        meaning: "前五批收盘价在分钟高低区间中的平均位置"
      - name: "pulse_return_sum"
        meaning: "前五批分钟涨跌幅之和"
      - name: "quiet_net_return"
        meaning: "五批之间非放量分钟的净涨跌"
      - name: "quiet_abs_mean"
        meaning: "五批之间非放量分钟的平均绝对波动"
      - name: "rise_concentration"
        meaning: "上涨是否主要集中在五个放量分钟"
  - table_key: "periodic_level2_events"
    description: "2026年分钟候选对应的逐笔成交与十档行情特征；原始超大文件已先缩成每个候选一行"
    type: "auxiliary"
    granularity: "event_level2"
    datetime_column: "date"
    symbol_column: "code"
    primary_keys: ["candidate_id"]
    time_range:
      start_time: "2026-02-02 00:00:00"
      end_time: "2026-07-22 23:59:59"
    fields:
      - name: "candidate_id"
        meaning: "事件编号"
      - name: "date"
        meaning: "交易日"
      - name: "code"
        meaning: "股票代码，格式如sh600000或sz000001"
      - name: "trigger_ts"
        meaning: "全部筛选条件已可见的时刻；信号最早从下一分钟开盘执行"
      - name: "predicted_ts"
        meaning: "按前五批间隔预计的下一批时刻"
      - name: "period"
        meaning: "五批量能节奏的分钟间隔"
      - name: "past_up_count"
        meaning: "前五批中上涨分钟的数量"
      - name: "return_stability"
        meaning: "前五批涨跌幅的离散程度"
      - name: "no_early_spike"
        meaning: "第五批之后到确认时刻前是否没有提前放量"
      - name: "pre_window_up"
        meaning: "确认分钟是否上涨"
      - name: "pulse_combined_buy_share"
        meaning: "前五批合计主动买入金额占比"
      - name: "pulse_combined_net_buy_share"
        meaning: "前五批主动净买入金额占比"
      - name: "pulse_buy_share_min"
        meaning: "前五批中最低的主动买入金额占比"
      - name: "pulse_buy_share_ge60_count"
        meaning: "前五批中主动买入金额占比至少60%的批次数"
      - name: "pulse_buy_share_ge70_count"
        meaning: "前五批中主动买入金额占比至少70%的批次数"
      - name: "pulse_active_buy_amount_cv"
        meaning: "前五批主动买入金额的离散程度"
      - name: "pulse_active_buy_amount_max_min"
        meaning: "前五批主动买入金额最大值除以最小值；越接近1越相似"
      - name: "pulse_order_distribution_log_spread"
        meaning: "前五批买单大小分布的差异"
      - name: "pulse_order_shape_similarity"
        meaning: "前五批买单大小形状的相似度"
      - name: "pulse_largest_order_min"
        meaning: "前五批各自最大买单中的最小值"
      - name: "pulse_largest_order_share_min"
        meaning: "前五批各自最大买单占比中的最小值"
      - name: "pulse_top3_order_share_min"
        meaning: "前五批各自前三大买单占比中的最小值"
      - name: "pulse_mid_lift_positive_count"
        meaning: "前五批中成交后中间价上移的批次数"
      - name: "pulse_mid_lift_median"
        meaning: "前五批成交后中间价上移幅度的中位数"
      - name: "pulse_ask_lift_count"
        meaning: "前五批中卖一价格被抬高的批次数"
      - name: "pulse_ask_depth_consumed_median"
        meaning: "前五批卖一数量被消耗比例的中位数"
      - name: "pulse_peak_largest_order_min"
        meaning: "各批主动买入最强一秒内最大买单的最小值"
      - name: "pulse_peak_largest_order_share_min"
        meaning: "各批主动买入最强一秒内最大买单占比的最小值"
      - name: "pulse_peak_top3_order_share_min"
        meaning: "各批主动买入最强一秒内前三大买单占比的最小值"
      - name: "pulse_peak_order_shape_similarity"
        meaning: "各批主动买入最强一秒内买单形状的相似度"
      - name: "market_up_share_at_trigger"
        meaning: "确认时刻全市场上涨股票比例"
      - name: "market_spike_share_at_trigger"
        meaning: "确认时刻全市场异常放量股票比例"
      - name: "quiet_net_return"
        meaning: "五批之间非放量分钟的净涨跌"
      - name: "rise_concentration"
        meaning: "上涨是否主要集中在五个放量分钟"
  - table_key: "periodic_minute_candidates_2026"
    description: "2026年全市场一分钟五批规律候选，共约23.9万行；用于研究分钟形态，不能直接证明主动买入"
    type: "auxiliary"
    granularity: "event_1m"
    datetime_column: "date"
    symbol_column: "code"
    primary_keys: ["candidate_id"]
    time_range:
      start_time: "2026-02-02 00:00:00"
      end_time: "2026-07-22 23:59:59"
    fields:
      - name: "candidate_id"
        meaning: "事件编号"
      - name: "date"
        meaning: "交易日"
      - name: "code"
        meaning: "股票代码"
      - name: "trigger_ts"
        meaning: "全部筛选条件已可见的时刻"
      - name: "period"
        meaning: "量能节奏的分钟间隔"
      - name: "past_up_count"
        meaning: "前五批中上涨分钟的数量"
      - name: "return_stability"
        meaning: "前五批涨跌幅的离散程度"
      - name: "no_early_spike"
        meaning: "第五批后到确认时刻前是否没有提前放量"
      - name: "pre_window_up"
        meaning: "确认分钟是否上涨"
